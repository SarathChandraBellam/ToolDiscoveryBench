# ToolDiscoveryBench: "can this router name the right tool, and how fast?"

catalog:
  - data/catalog/public.json                  # real tools, from `tdb pull`
  - data/catalog/distractors_synthetic.json   # synthetic pad so sizes can go past ~30
# Suites = golden files (see data/golden/README.md). Run a subset with `tdb run --suites a,b`.
suites:
  # Each question carries its own catalog: the tools of the servers "connected" for it.
  # Includes no-tool questions (~20%) where the right answer is to abstain. The same question
  # shares one `qid` across suites; `split` / tag split:test marks the frozen held-out set.
  - name: one_server              # 696 q (147 no-tool), 1 server connected (1-5 tools)
    golden: data/golden/datasets_v1/one_server.jsonl
  - name: multi_server            # same 696 q, 4 servers connected (7-18 tools)
    golden: data/golden/datasets_v1/multi_server.jsonl
  - name: multi_confused          # 405 q (81 no-tool) from multi_server, confusable catalogs
    golden: data/golden/datasets_v1/multi_server_confused.jsonl
  # Sampled catalogs: gold + seeded distractors at each size below.
  - name: claude_v2               # 190 q (39 no-tool) labelled by Haiku/Sonnet/Opus + Opus judge
    golden: data/golden/claude/golden_v2.jsonl
    enabled: ${TDB_CLAUDE_V2:-true}

# For suites without fixed catalogs: gold tool(s) + seeded distractors (same-server first,
# i.e. hard negatives). Every router sees the identical catalog for a given size.
catalog_sizes: [10, 30, 75, 150]
repeats: 1          # quick runs; published numbers must use repeats >= 3 (variance + CIs)
concurrency: 4      # default per router; override per router below
seed: 0
warmup: true

routers:
  # ---- free baselines (no keys) ----
  - name: bm25
    type: bm25

  - name: bm25-abstain            # same, but abstains when no tool scores above the threshold
    type: bm25
    abstain_threshold: 1.0        # any router can take this (applied by the runner)

  - name: embed-bge-small
    type: embedding
    enabled: ${TDB_EMBED:-false}        # needs `pip install fastembed`
    model: BAAI/bge-small-en-v1.5

  # ---- Decision models via OpenRouter (one OPENROUTER_API_KEY for both) ----
  # POST https://openrouter.ai/api/alpha/decisions · measured cost comes from usage.cost
  - name: or-jev-flat
    type: openrouter
    model: typesafe/jev-1.13             # pinned; ~typesafe/jev-latest follows the alias
    mode: flat
    concurrency: 4
    usd_per_m_input: 0.042               # fallback if usage.cost is missing; ctx 32K

  - name: or-jev-factored
    type: openrouter
    model: typesafe/jev-1.13
    mode: factored
    concurrency: 4
    usd_per_m_input: 0.042

  - name: or-luna-flat
    type: openrouter
    model: openai/gpt-6-luna-decisions
    mode: flat
    concurrency: 4
    usd_per_m_input: 0.10                # ctx 1.1M

  - name: or-luna-factored
    type: openrouter
    model: openai/gpt-6-luna-decisions
    mode: factored
    concurrency: 4
    usd_per_m_input: 0.10

  # ---- TypeSafe Jev (direct) ----
  - name: jev-flat
    type: jev
    dialect: typesafe                   # POST https://api.typesafe.ai/v1/systemone
    model: jev-1.13                     # pinned, same version as the OpenRouter routers
    mode: flat
    desc_chars: 240
    concurrency: 4
    usd_per_m_input: 0.042

  - name: jev-factored                  # P(server) x P(tool|server), ONE request
    type: jev
    dialect: typesafe
    model: jev-1.13
    mode: factored
    usd_per_m_input: 0.042

  - name: jev-hier                      # server call, then tool call (2 round-trips)
    type: jev
    dialect: typesafe
    model: jev-1.13
    mode: hierarchical
    top_servers: 2
    usd_per_m_input: 0.042

  # Same model through a /v1/decisions gateway (Bifrost, NanoGPT, ...):
  - name: jev-gateway
    type: jev
    enabled: ${TDB_JEV_GATEWAY:-false}
    dialect: decisions
    base_url: ${JEV_GATEWAY_URL:-http://localhost:8080}
    path: /v1/decisions                 # NanoGPT: /api/v1/decisions
    question_type_key: kind             # NanoGPT uses `type`
    api_key_env: JEV_GATEWAY_KEY
    model: typesafe/jev-1.13
    mode: flat

  # ---- OpenAI Decisions API (public beta, gpt-6-luna) ----
  - name: openai-decisions-flat
    type: openai_decisions
    model: gpt-6-luna
    mode: flat
    desc_chars: 240
    concurrency: 4
    usd_per_m_input: 0.10

  - name: openai-decisions-factored     # P(server) x P(tool|server), ONE request
    type: openai_decisions
    model: gpt-6-luna
    mode: factored
    usd_per_m_input: 0.10

  # ---- Strands Agents (LLM picks the tool) ----
  - name: strands-haiku-native          # real tool-calling: stub tools with real schemas
    type: strands
    provider: ${STRANDS_PROVIDER:-bedrock}
    model_id: ${STRANDS_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
    region: ${AWS_REGION:-us-east-1}
    mode: native
    temperature: 0
    concurrency: 2
    usd_per_m_input: 1.0                # set to your model's input price

  - name: strands-haiku-structured      # catalog in prompt, pydantic output
    type: strands
    provider: ${STRANDS_PROVIDER:-bedrock}
    model_id: ${STRANDS_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
    region: ${AWS_REGION:-us-east-1}
    mode: structured
    desc_chars: 300
    temperature: 0
    concurrency: 2
    usd_per_m_input: 1.0

  # Strands driven by an open-weight model on Hugging Face Inference Providers (HF_TOKEN)
  - name: strands-hf-qwen-native
    type: strands
    provider: huggingface
    model_id: ${HF_STRANDS_MODEL:-Qwen/Qwen3-32B}
    mode: native
    temperature: 0
    concurrency: 2

  - name: strands-hf-qwen-structured
    type: strands
    provider: huggingface
    model_id: ${HF_STRANDS_MODEL:-Qwen/Qwen3-32B}
    mode: structured
    desc_chars: 300
    temperature: 0
    concurrency: 2
